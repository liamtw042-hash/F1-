<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>Crazy Grand Prix</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        // roundRect polyfill for older browsers
        if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                r = Math.min(r || 0, w / 2, h / 2);
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }
    </script>
</head>
<body>

<canvas id="glCanvas" width="1280" height="720" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1"></canvas>
<canvas id="gameCanvas" style="display:none;z-index:2"></canvas>
<div id="menu"></div>

<!-- ?v= cache-buster: bump on every release so browsers & CDNs fetch fresh files -->
<script src="js/tracks.js?v=4.2"></script>
<script src="js/net.js?v=4.2"></script>
<script src="js/gl.js?v=4.2"></script>
<script src="js/f1.js?v=4.2"></script>
<script>
    // Scale canvases to fit window while keeping 16:9
    function fit() {
        const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
        for (const id of ['gameCanvas', 'glCanvas']) {
            const c = document.getElementById(id);
            c.style.width = Math.round(1280 * s) + 'px';
            c.style.height = Math.round(720 * s) + 'px';
        }
    }
    fit();
    window.addEventListener('resize', fit);
</script>
</body>
</html>
